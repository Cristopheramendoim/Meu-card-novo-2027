<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Defs para recortes e estilos -->
  <defs>
    <clipPath id="lensClip">
      <circle cx="58" cy="62" r="17" />
    </clipPath>
    <clipPath id="innerLensClip">
      <circle cx="58" cy="62" r="7" />
    </clipPath>
  </defs>

  <!-- Sombra suave sutil para o ícone se destacar em abas escuras ou claras -->
  <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3"/>
  </filter>

  <g filter="url(#subtleGlow)">
    <!-- Top Dial / Flash Bracket -->
    <path d="M 46 36 Q 58 29 70 36 Z" fill="#ffffff" stroke="#141416" stroke-width="3.8" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Right Hand Grip / Vertical Battery Pillar (Cinza Escuro) -->
    <rect x="74" y="27" width="26" height="63" rx="12" fill="#38383c" stroke="#141416" stroke-width="4.2" stroke-linejoin="round" />
    
    <!-- Grip Sensor / Oval Light Window -->
    <ellipse cx="87" cy="43" rx="6.5" ry="6.5" fill="#18181a" stroke="#141416" stroke-width="2.5" />
    <ellipse cx="85.5" cy="41.5" rx="2.5" ry="2.5" fill="#888890" />

    <!-- Main Camera Body (Branco com Contorno Preto Orgânico) -->
    <rect x="14" y="36" width="65" height="54" rx="4" fill="#ffffff" stroke="#141416" stroke-width="4.2" stroke-linejoin="round" />

    <!-- Cantoneira inferior esquerda (Detalhe Bege/Salmão) -->
    <path d="M 15.5 81 L 27 90 L 15.5 90 Z" fill="#cfb1ab" stroke="#141416" stroke-width="2.2" stroke-linejoin="round" />

    <!-- Cantoneira inferior direita (Detalhe Bege/Salmão no grip) -->
    <path d="M 98.5 79 L 88 89 L 98.5 89 Z" fill="#cfb1ab" stroke="#141416" stroke-width="2.2" stroke-linejoin="round" />

    <!-- Visor Superior Esquerdo -->
    <rect x="22" y="41" width="13" height="7.5" rx="3.5" fill="#ffffff" stroke="#141416" stroke-width="3.2" stroke-linejoin="round" />

    <!-- Curvatura decorativa contornando a lente (Hand-drawn flare) -->
    <path d="M 44 38 C 38 48 30 57 32 73 C 33 80 43 90 58 90 C 71 90 77 82 77 73" fill="none" stroke="#141416" stroke-width="3.5" stroke-linecap="round" />

    <!-- Círculo Externo da Lente -->
    <circle cx="58" cy="62" r="25.5" fill="#ffffff" stroke="#141416" stroke-width="4.5" />

    <!-- Miolo da Lente (Preto) -->
    <circle cx="58" cy="62" r="17" fill="#151518" stroke="#141416" stroke-width="3.8" />

    <!-- Ranhuras/Linhas Verticais na Lente -->
    <g clip-path="url(#lensClip)" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round">
      <line x1="44" y1="40" x2="44" y2="85" />
      <line x1="47.5" y1="40" x2="47.5" y2="85" />
      <line x1="51" y1="40" x2="51" y2="85" />
      <line x1="54.5" y1="40" x2="54.5" y2="85" />
      <line x1="58" y1="40" x2="58" y2="85" />
      <line x1="61.5" y1="40" x2="61.5" y2="85" />
      <line x1="65" y1="40" x2="65" y2="85" />
      <line x1="68.5" y1="40" x2="68.5" y2="85" />
      <line x1="72" y1="40" x2="72" y2="85" />
    </g>

    <!-- Centro da Lente com Reflexo Diagonal -->
    <circle cx="58" cy="62" r="7.5" fill="#252528" stroke="#141416" stroke-width="2.2" />
    <g clip-path="url(#innerLensClip)">
      <line x1="48" y1="72" x2="68" y2="52" stroke="#ffffff" stroke-width="3.5" />
      <line x1="52" y1="76" x2="72" y2="56" stroke="#909096" stroke-width="2" />
    </g>
  </g>
</svg>
